services:
  mysql:
    image: mysql
    container_name: 'mysql-trackspire'
    hostname: mysql-trackspire
    environment:
      MYSQL_DATABASE: 'flowtix'
      MYSQL_USER: 'testing'
      MYSQL_PASSWORD: '1234'
      MYSQL_ROOT_PASSWORD: '1234'
    ports:
      - '3306:3306'
    expose:
      - '3306'
    volumes:
      - flowtixData:/var/lib/mysql:rw
      - ./data/mysql:/docker-entrypoint-initdb.d/:ro
    networks:
      - trackspire-shared

  phpmyadmin:
    image: phpmyadmin
    container_name: 'pma-trackspire'
    links:
      - mysql
    environment:
      PMA_HOST: mysql-trackspire
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
    ports:
      - '8081:80'
    networks:
      - trackspire-shared

  redis:
    image: redis:7.4.1
    container_name: 'redis-trackspire'
    ports:
      - '6379:6379'
    command: ['redis-server', '--requirepass', '1234']
    volumes:
      - redis_data:/data
    networks:
      - trackspire-shared

  # MinIO stopped publishing images on Docker Hub and Quay in October 2025; Chainguard keeps building them.
  minio:
    image: cgr.dev/chainguard/minio
    container_name: 'minio-trackspire'
    hostname: minio-trackspire
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: 'trackspire'
      MINIO_ROOT_PASSWORD: 'trackspire1234'
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    networks:
      - trackspire-shared

  # Creates the bucket once MinIO is up. Logos are linked from the dashboard and from emails, so their prefix
  # is readable without credentials; everything else in the bucket stays private.
  minio-init:
    # The -dev variant ships a shell, which the script below needs
    image: cgr.dev/chainguard/minio-client:latest-dev
    container_name: 'minio-init-trackspire'
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio-trackspire:9000 trackspire trackspire1234; do sleep 1; done;
      mc mb --ignore-existing local/trackspire;
      mc anonymous set download local/trackspire/organization-logos;
      "
    networks:
      - trackspire-shared

volumes:
  flowtixData:
  redis_data:
  minio_data:

networks:
  trackspire-shared:
    external: true